name: sseddume_pos
description: SSEDDUME LABS - offline-first Business Management & POS
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  # Encrypted local database (SQLCipher). Same code later runs on Windows.
  sqlite3: ^2.4.7
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  # Camera scanning (Google ML Kit, bundled so it works offline)
  mobile_scanner: ^6.0.2
  # Label / sticker generation
  pdf: ^3.11.1
  printing: ^5.13.4
  barcode: ^2.2.8
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
